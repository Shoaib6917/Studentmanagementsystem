<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>
</head>
<body>
    <h1>Student Result</h1>

    <form>
        Student Name:
        <input type="text" required><br><br>

        Roll Number:
        <input type="text" required><br><br>

        Subject:
        <input type="text" required><br><br>

        Marks:
        <input type="number" required><br><br>

        Grade:
        <select>
            <option>A+</option>
            <option>A</option>
            <option>B+</option>
            <option>B</option>
            <option>C</option>
            <option>Fail</option>
        </select><br><br>

        <button type="submit">Submit Result</button>
    </form>

</body>
</html>
